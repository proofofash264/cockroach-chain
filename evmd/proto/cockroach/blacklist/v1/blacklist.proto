syntax = "proto3";
package cockroach.blacklist.v1;
option go_package = "github.com/cosmos/evm/evmd/x/blacklist/types";

message FrozenEntry {
  string address = 1;
  string reason = 2;
}
message GenesisState {
  repeated FrozenEntry entries = 1;
}

message MsgFreezeAddress {
  string authority = 1;
  string address = 2;
  string reason = 3;
}
message MsgFreezeAddressResponse {}
message MsgUnfreezeAddress {
  string authority = 1;
  string address = 2;
}
message MsgUnfreezeAddressResponse {}

message QueryIsFrozenRequest { string address = 1; }
message QueryIsFrozenResponse { bool frozen = 1; string reason = 2; }
message QueryFrozenAddressesRequest {}
message QueryFrozenAddressesResponse { repeated FrozenEntry entries = 1; }

service Msg {
  rpc FreezeAddress(MsgFreezeAddress) returns (MsgFreezeAddressResponse);
  rpc UnfreezeAddress(MsgUnfreezeAddress) returns (MsgUnfreezeAddressResponse);
}
service Query {
  rpc IsFrozen(QueryIsFrozenRequest) returns (QueryIsFrozenResponse);
  rpc FrozenAddresses(QueryFrozenAddressesRequest) returns (QueryFrozenAddressesResponse);
}
