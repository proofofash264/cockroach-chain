syntax = "proto3";
package cockroach.blacklist.v1;
option go_package = "github.com/cosmos/evm/evmd/x/blacklist/types";

import "cosmos_proto/cosmos.proto";
import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";

service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc FreezeAddress(MsgFreezeAddress) returns (MsgFreezeAddressResponse);
  rpc UnfreezeAddress(MsgUnfreezeAddress) returns (MsgUnfreezeAddressResponse);
}

message MsgFreezeAddress {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "cockroach/x/blacklist/MsgFreezeAddress";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string address = 2;
  string reason = 3;
}
message MsgFreezeAddressResponse {}

message MsgUnfreezeAddress {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "cockroach/x/blacklist/MsgUnfreezeAddress";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string address = 2;
}
message MsgUnfreezeAddressResponse {}
